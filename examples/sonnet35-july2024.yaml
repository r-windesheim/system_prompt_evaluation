id: sonnet35-july2024
title: Claude 3.5 Sonnet system prompt (July 2024) on gpt-oss-20b
notes: System prompt published by Anthropic for Claude 3.5 Sonnet on claude.ai (12 July 2024), run here on a different model, openai/gpt-oss-20b. The date placeholder is filled in as 12 July 2024. The image section is left out because no images are sent. Thirteen questions were written for each of the 16 parts, 208 in all; the first 48 (three per part) are the ones the first run used, the next 80 (five per part) came with the targets, and the last 80 (five per part) were added so that intended checks, which are tested by question, can pass the multiple-testing correction. Each question names the part it targets, so intended behaviour is checked where it applies. A question gets 2 samples where it targets the removed part and 1 elsewhere (3,952 answers).
provider:
  kind: openai
  base_url: https://rp-windesheim--spet-vllm-serve.us-east.modal.run/v1
  model: openai/gpt-oss-20b
  max_concurrency: 32
  max_tokens: 4000
  extra:
    reasoning_effort: low
seed: 0
n_per_query: 2
# discovery tests by question, so questions buy power and samples of the same question buy little:
# 2 samples where the question targets the removed part, 1 everywhere else (side-effect checks)
n_per_query_untargeted: 1
temperature: 0.7
