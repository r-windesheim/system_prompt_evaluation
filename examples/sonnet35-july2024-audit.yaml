# Audit of the intended statements in runs_out/sonnet35-july2024-v3.json (input to `spet readout --audit`).
#
# Who: an AI reviewer, Claude Opus, reading the stored answers and the judge's stored verdicts. One Claude Opus
# instance made the first-test decisions; four Claude Opus instances gave the blind per-answer verdicts of the spot
# check. They read text already in the bundle. No SPET answer or judge endpoint was called and nothing ran on Modal.
# The first-test decisions were made with the stored rates visible; no reading had been computed.
#
# Rules, fixed before any reading was computed and not revisited afterwards:
# 1. First test, decided from the part's text, the statement and the targeted questions, before any spot check:
#    is the statement a faithful, single, checkable restatement of something the part's text asks for, and does it
#    apply to the questions written for that part?
# 2. Spot check: up to 3 stored verdicts where the judge said YES and up to 3 where it said NO, with the part
#    present, from the run whose numbers the readout uses (the confirmation run for statements it retested, else
#    the main run). Cells drawn with random.Random("audit:<statement id>").sample over that run's with-part YES
#    (resp. NO) verdicts. The reviewer judged each answer blind (no label, no counts, shuffled order) under the
#    judge's own YES / NO / NA instructions, on the answer cut at the judge's 12,000 characters. A reviewer NA
#    against a judge YES or NO counts as a disagreement.
# 3. Invalid if the statement fails the first test, or the reviewer disagrees with the judge on more than one of
#    the checked verdicts.
#
# `agreement`: checked verdicts the reviewer agreed with, out of those checked. `checked`: [question, sample,
# judge, reviewer] per cell; question and sample index the `data` run's questions and responses.

