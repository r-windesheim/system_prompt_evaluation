# ======================================================================================================================
# Authored statements (separate section, added 2026-11-18): the statements in examples/sonnet35-july2024-authored.yaml
# (sha256 a1f82ddc36ebc2c73cd9bbba751d386d5412b53d285e0b1ce73045de1c8d8c2d), written by an AI reviewer (Claude Opus)
# from the instruction text, blind to the answers, then judged once with `spet authored` on the v4 bundle's stored
# answers (runs_out/sonnet35-july2024-v5-authored.json; gpt-oss-20b judge, settings matched to the screen).
#
# Same rules as above, applied after judging and not revisited:
# 1. First test: passed for every statement. It was decided by the statements' author when writing them, so it is not
#    independent; the spot check is.
# 2. Spot check: up to 3 judge-YES and 3 judge-NO with-part (`full`) verdicts from the main run, drawn with
#    random.Random("audit:<id>").sample over the sorted YES cells, then the sorted NO cells. Four fresh Claude Opus
#    instances judged the 76 answers blind (no verdict, no statement id, shuffled order, split into four batches) under
#    the judge's YES / NO / NA instructions, on answers cut at 12,000 characters. A reviewer NA against a judge YES or NO
#    counts as a disagreement. Where fewer than 3 cells of a class existed, all were checked.
# 3. Invalid if more than one disagreement. A failed statement is reported as failed; none was rewritten or re-run.
# For the two Answer length statements (no judge), the spot check is a recount of the same draw by a different word
# count (whitespace split).
# `data: authored`: question and sample index the main run's questions and responses.
authored_statements:
  p0.a0:
    valid: true
    reason: Spot check agrees 4/4 (only one with-part NO verdict existed). Valid by the audit, but the run flags it judge_unreliable (re-judge agreement 0.70), so the readout still leaves it out.
    first_test: true
    agreement: 4/4
    data: authored
    checked:
    - [1, 0, 'YES', 'YES']
    - [132, 0, 'NO', 'NO']
    - [1, 1, 'YES', 'YES']
    - [128, 1, 'YES', 'YES']
  p0.a1:
    valid: true
    reason: 'Spot check agrees 3/3 (no with-part YES verdict existed to check). Caveat: unconditional, so most of its 13 questions give no occasion to self-identify, which favours compliance.'
    first_test: true
    agreement: 3/3
    data: authored
    checked:
    - [131, 1, 'NO', 'NO']
    - [50, 1, 'NO', 'NO']
    - [0, 0, 'NO', 'NO']
  p0.a2:
