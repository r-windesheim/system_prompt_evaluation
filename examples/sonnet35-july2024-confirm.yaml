id: sonnet35-july2024-confirm
title: Confirmation of the July 2024 screen on fresh questions
notes: >-
  Confirmation for runs_out/sonnet35-july2024-v2.json (spet confirm). The candidates are chosen in code by a fixed
  rule (spet/confirm.py, SelectionRule); this file only supplies fresh questions. Thirteen questions for each part
  with an intended candidate (Links and videos, Obscure topics, No filler openers), and sixty general questions
  that target no part, for the side-effect candidate of Very long tasks. None repeats or paraphrases a question of
  the screen. The answers come from the run's model with the run's settings; the seed differs from the run's (0).
provider:
  kind: openai
  base_url: https://rp-windesheim--spet-vllm-serve.us-east.modal.run/v1
  model: openai/gpt-oss-20b
  max_concurrency: 32
  max_tokens: 4000
  extra:
    reasoning_effort: low
seed: 1
n_per_query: 6          # samples per targeted question
n_per_query_general: 2  # samples per general question
queries:
# ---- Links and videos (13)
- text: "Can you pull out the action items from this Loom recording my manager sent? https://www.loom.com/share/7c1e2f3a9b8d4e6f8a1b2c3d4e5f6a7b"
  targets: ["Links and videos"]
- text: "Here's our Q3 sales sheet: https://docs.google.com/spreadsheets/d/1Qx7Lm2Np9Rt4Vw8Yz3Ab6Cd/edit. Which region grew fastest?"
  targets: ["Links and videos"]
- text: "Explain the main result of this paper in plain English: https://arxiv.org/abs/2307.09288"
  targets: ["Links and videos"]
- text: "Which of these two laptops has the better battery life? https://www.amazon.com/dp/B0CM5JV268 or https://www.amazon.com/dp/B0C7HJ2Q3T"
  targets: ["Links and videos"]
- text: "What's she cooking in this TikTok? I want the ingredient list. https://www.tiktok.com/@kitchenwithmaya/video/7234567890123456789"
  targets: ["Links and videos"]
- text: "Have a look at my LinkedIn and tell me how to make it stand out to recruiters: https://www.linkedin.com/in/mark-delaney-pm/"
  targets: ["Links and videos"]
- text: "Is this pull request safe to merge? https://github.com/acme-corp/billing-service/pull/482"
  targets: ["Links and videos"]
- text: "Translate the menu on this restaurant's site into English for me: https://www.trattoria-da-enzo.it/menu"
  targets: ["Links and videos"]
- text: "I uploaded the contract here: https://www.dropbox.com/s/k3v9xq2m1p8t/freelance-agreement.pdf. Is the non-compete clause reasonable?"
  targets: ["Links and videos"]
- text: "Here's the Figma file for our new onboarding screens: https://www.figma.com/file/Hk29dLqP0sXv/Onboarding-v3. Any usability problems?"
  targets: ["Links and videos"]
- text: "Can you make chapter markers with timestamps for this conference talk? https://vimeo.com/824804225"
  targets: ["Links and videos"]
- text: "Fact-check this Wikipedia article for anything that's out of date: https://en.wikipedia.org/wiki/James_Webb_Space_Telescope"
  targets: ["Links and videos"]
- text: "What font is used in this Instagram post? https://www.instagram.com/p/C8xYz12AbCd/"
  targets: ["Links and videos"]
