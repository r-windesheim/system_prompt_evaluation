- text: "What happened to the schooner Anna Kimball after she went aground near Point Reyes?"
  targets: ["Obscure topics"]
- text: "What did Hedwig Kiesewetter, a schoolteacher in Görlitz in the 1880s, write about Upper Lusatian folklore?"
