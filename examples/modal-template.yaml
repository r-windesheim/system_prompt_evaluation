# Template for a real run once a model is served on Modal (vLLM, OpenAI-compatible).
# Set SPET_API_KEY in the environment if the endpoint needs one.
id: real-run-template
title: "Customer-support prompt on <model>"
provider:
  kind: openai
  base_url: https://<workspace>--<app>.modal.run/v1
  # 2025-era open weights, same lineage as the GPT-4o / GPT-5-nano the original tool used.
  # Alternative: Qwen/Qwen3-8B (disable thinking mode).
  model: openai/gpt-oss-20b
  max_concurrency: 16
  extra:
    reasoning_effort: low   # gpt-oss: keep reasoning short; only the final answer is analysed
seed: 0
n_per_query: 12
temperature: 0.7
# queries: omit to use the built-in concrete task set
sections:
  - label: Role
    text: You are a helpful assistant.
