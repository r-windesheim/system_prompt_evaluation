# Template for a real run once a model is served on Modal (vLLM, OpenAI-compatible).
# Set SPET_API_KEY in the environment if the endpoint needs one.
id: real-run-template
title: "Customer-support prompt on <model>"
provider:
  kind: openai
  base_url: https://<workspace>--<app>.modal.run/v1
  model: Qwen/Qwen2.5-7B-Instruct
  max_concurrency: 16
seed: 0
n_per_query: 12
temperature: 0.7
# queries: omit to use the built-in concrete task set
sections:
  - label: Role
    text: You are a helpful assistant.
